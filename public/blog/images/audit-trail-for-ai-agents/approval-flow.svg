<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <title id="t">How one approval becomes three linked audit events</title>
  <desc id="d">The agent asks to take a sensitive action. Glaux policy returns require approval. Control Tower creates a pending approval tied to the session, run envelope, action and resource, with a risk level and an expiry. The person approves or rejects, or it expires. Before the action runs, the approval is checked again. Creating the approval and every change to it writes an audit event that points at the same approval record.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0a0a0a"/></marker></defs>
  <rect width="800" height="1000" fill="#ffffff"/>
  <text x="40" y="60" font-size="30" font-weight="700" fill="#0a0a0a">One approval, fully traceable</text>
  <path d="M150 120V900" stroke="#e5e5e5" stroke-width="6"/>
  <g>
    <circle cx="150" cy="150" r="22" fill="#0a0a0a"/><text x="150" y="157" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="200" y="146" font-size="23" font-weight="700" fill="#0a0a0a">Agent wants a sensitive action</text>
    <text x="200" y="176" font-size="19" fill="#525252">e.g. send a file to an outside address</text>
    <circle cx="150" cy="300" r="22" fill="#0a0a0a"/><text x="150" y="307" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="200" y="296" font-size="23" font-weight="700" fill="#0a0a0a">Policy says: require approval</text>
    <text x="200" y="326" font-size="19" fill="#525252">Policy decision on this exact action</text>
    <circle cx="150" cy="450" r="22" fill="#2563eb"/><text x="150" y="457" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="200" y="446" font-size="23" font-weight="700" fill="#0a0a0a">Pending approval is created</text>
    <text x="200" y="476" font-size="19" fill="#525252">Bound to session, envelope, action, resource</text>
    <text x="200" y="504" font-size="19" fill="#525252">Has a risk level and an expiry</text>
    <circle cx="150" cy="620" r="22" fill="#0a0a0a"/><text x="150" y="627" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="200" y="616" font-size="23" font-weight="700" fill="#0a0a0a">Approved, rejected, or expired</text>
    <g font-size="17" font-weight="600">
      <rect x="200" y="638" width="130" height="38" rx="8" fill="#dbeafe"/><text x="265" y="663" fill="#1e3a8a" text-anchor="middle">APPROVED</text>
      <rect x="342" y="638" width="130" height="38" rx="8" fill="#f2f2f2"/><text x="407" y="663" fill="#0a0a0a" text-anchor="middle">REJECTED</text>
      <rect x="484" y="638" width="130" height="38" rx="8" fill="#f2f2f2"/><text x="549" y="663" fill="#0a0a0a" text-anchor="middle">EXPIRED</text>
    </g>
    <circle cx="150" cy="790" r="22" fill="#0a0a0a"/><text x="150" y="797" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="200" y="786" font-size="23" font-weight="700" fill="#0a0a0a">Checked again before it runs</text>
    <text x="200" y="816" font-size="19" fill="#525252">Same envelope, same action, still a member</text>
  </g>
  <g font-size="25" font-weight="700" fill="#2563eb" letter-spacing="1" text-anchor="end">
    <text x="114" y="458">AUDIT</text><text x="114" y="628">AUDIT</text>
  </g>
  <rect x="40" y="880" width="720" height="84" rx="16" fill="#0a0a0a"/>
  <text x="70" y="914" font-size="19" fill="#ffffff">Each audit event points at the same approval.</text>
  <text x="70" y="942" font-size="19" fill="#ffffff">An expiry is logged with the system as the actor.</text>
</svg>
