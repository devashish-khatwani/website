<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1060" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <title id="t">Anatomy of one Glaux audit record</title>
  <desc id="d">An audit record grouped into five parts. Who: actor ID and type (user, service account, system or vendor). Where: organization and workspace. What: area, resource type and ID, action, and a short safe summary. Result: outcome such as success, denied or failed, plus the policy version. Proof: source system and event ID, source time and ingestion time, SHA-256 hash of the source record, and correlation IDs like the run ID.</desc>
  <rect width="800" height="1060" fill="#ffffff"/>
  <text x="40" y="60" font-size="30" font-weight="700" fill="#0a0a0a">What one audit record holds</text>
  <rect x="40" y="96" width="720" height="924" rx="16" fill="#fafafa" stroke="#0a0a0a" stroke-width="3"/>
  <g font-size="25" font-weight="700" fill="#2563eb" letter-spacing="1">
    <text x="72" y="148">WHO</text><text x="72" y="300">WHERE</text><text x="72" y="430">WHAT</text><text x="72" y="626">RESULT</text><text x="72" y="784">PROOF</text>
  </g>
  <g font-size="21" fill="#0a0a0a">
    <text x="72" y="184">Actor ID</text><text x="72" y="216">Actor type: user, service account,</text><text x="72" y="244">system, or vendor</text>
    <text x="72" y="336">Organization</text><text x="72" y="366">Workspace</text>
    <text x="72" y="466">Area (Policies, AI Gateway, Skills…)</text><text x="72" y="496">Resource type and ID</text><text x="72" y="526">Action</text><text x="72" y="556">Safe summary, 160 characters max</text>
    <text x="72" y="662">Outcome: submitted, success, denied,</text><text x="72" y="690">failed, skipped, or unknown</text><text x="72" y="720">Policy version that decided it</text>
    <text x="72" y="820">Source system and source event ID</text><text x="72" y="850">Source time and ingestion time</text><text x="72" y="880">SHA-256 hash of the source record</text><text x="72" y="910">Correlation: run, policy, request IDs</text><text x="72" y="940">Schema version</text>
  </g>
  <g stroke="#e5e5e5" stroke-width="2"><path d="M72 268h656M72 394h656M72 586h656M72 748h656"/></g>
  <rect x="560" y="124" width="168" height="40" rx="8" fill="#0a0a0a"/>
  <text x="644" y="151" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">append-only</text>
  <text x="72" y="990" font-size="18" fill="#737373">Never stored: prompts, responses, raw tool payloads, credentials.</text>
</svg>
